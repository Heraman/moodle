services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle_db_password_rahasia
      MYSQL_ROOT_PASSWORD: moodle_root_password_rahasia
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umoodle", "-pmoodle_db_password_rahasia"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle-php:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/www/moodledata
    working_dir: /var/www/html
    expose:
      - "9000"

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - moodle-php
    expose:
      - "80"
    volumes:
      - moodle_code:/var/www/html:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

volumes:
  db_data:
  moodle_data:
  moodle_code:
