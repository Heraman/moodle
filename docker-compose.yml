services:
  db:
    image: mysql:8.4
    container_name: moodle-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle_db_password_rahasia
      MYSQL_ROOT_PASSWORD: moodle_root_password_rahasia
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./config/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umoodle", "-pmoodle_db_password_rahasia"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle-php:
    build: .
    container_name: moodle-php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/www/moodledata
      - ./config/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-moodle.conf:ro
    working_dir: /var/www/html
    expose:
      - "9000"

  nginx:
    image: nginx:stable-alpine
    container_name: moodle-nginx
    restart: unless-stopped
    depends_on:
      - moodle-php
    expose:
      - "80" # Coolify Traefik akan otomatis routing ke port ini
    volumes:
      - moodle_code:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7-alpine
    container_name: moodle-redis
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

volumes:
  db_data:
  moodle_data:
  moodle_code:
